services:
  mongodb:
    image: mongo:7.0
    container_name: huawei-health-ai-backend-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: huawei-health-ai-backend
    volumes:
      - mongodb_data:/data/db
    networks:
      - huawei-health-ai-backend-network

  redis:
    image: redis:7.2-alpine
    container_name: huawei-health-ai-backend-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - huawei-health-ai-backend-network

  mongo-express:
    image: mongo-express:1.0.0
    container_name: huawei-health-ai-backend-mongo-express
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://admin:password@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      - mongodb
    networks:
      - huawei-health-ai-backend-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  huawei-health-ai-backend-network:
    driver: bridge
