openapi: 3.0.0
paths:
  /users/login:
    post:
      description: Authenticate user and set access and refresh tokens
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        "200":
          description: Login successful
        "401":
          description: Invalid credentials
      summary: User login
      tags: &a1
        - users
  /users/register:
    post:
      description: Register a new user and set access and refresh tokens
      operationId: AuthController_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDto"
      responses:
        "201":
          description: User created successfully
        "409":
          description: User already exists
      summary: User registration
      tags: *a1
  /users/logout:
    post:
      description: Revoke current session and clear tokens
      operationId: AuthController_logout
      parameters: []
      responses:
        "200":
          description: Logout successful
      security:
        - accessToken: []
      summary: User logout
      tags: *a1
  /users/logout/all:
    post:
      description: Revoke all sessions for the current user
      operationId: AuthController_logoutAll
      parameters: []
      responses:
        "200":
          description: Logout successful
      security:
        - accessToken: []
      summary: Logout from all devices
      tags: *a1
  /users/sessions:
    get:
      description: Returns a list of all active sessions for the current user
      operationId: AuthController_getSessions
      parameters: []
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionResponseDto"
      security:
        - accessToken: []
      summary: Get all sessions
      tags: *a1
  /healthcheck:
    get:
      description: Check if the API is running
      operationId: HealthController_check
      parameters: []
      responses:
        "200":
          description: API is healthy
      summary: Health check
      tags:
        - health
  /v1/integrations/huawei/connect-config:
    get:
      operationId: HuaweiController_getConnectConfig
      parameters: []
      responses:
        "200":
          description: Connect config returned
      security:
        - accessToken: []
      summary: Get Huawei connect flow configuration
      tags: &a2
        - integrations
  /v1/integrations/huawei/authorize:
    post:
      operationId: HuaweiController_authorize
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HuaweiAuthorizeDto"
      responses:
        "200":
          description: Authorization URL returned
      security:
        - accessToken: []
      summary: Initiate Huawei authorization
      tags: *a2
  /v1/integrations/huawei/callback:
    get:
      operationId: HuaweiController_callback
      parameters: []
      responses:
        "302":
          description: Redirect to client URL with result
      summary: Huawei OAuth callback
      tags: *a2
  /v1/integrations/huawei/status:
    get:
      operationId: HuaweiController_getStatus
      parameters: []
      responses:
        "200":
          description: Huawei connection status returned
      security:
        - accessToken: []
      summary: Get Huawei connection status
      tags: *a2
  /v1/integrations/huawei/consent:
    get:
      operationId: HuaweiController_getConsent
      parameters: []
      responses:
        "200":
          description: Consent settings returned
      security:
        - accessToken: []
      summary: Get Huawei consent settings data
      tags: *a2
    post:
      operationId: HuaweiController_updateConsent
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HuaweiUpdateConsentDto"
      responses:
        "200":
          description: Consent update processed
      security:
        - accessToken: []
      summary: Update Huawei enabled categories (app-level)
      tags: *a2
  /v1/integrations/huawei/consent/history:
    get:
      operationId: HuaweiController_getConsentHistory
      parameters: []
      responses:
        "200":
          description: Consent history returned
      security:
        - accessToken: []
      summary: Get Huawei consent history
      tags: *a2
  /v1/integrations/huawei/disconnect:
    post:
      operationId: HuaweiController_disconnect
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HuaweiDisconnectDto"
      responses:
        "200":
          description: Disconnected
      security:
        - accessToken: []
      summary: Disconnect Huawei integration locally
      tags: *a2
  /v1/health-data/sync-status:
    get:
      operationId: HealthDataController_getSyncStatus
      parameters: []
      responses:
        "200":
          description: Returns granular status information per metric category.
      security: &a3
        - accessToken: []
      summary: Get current Huawei synchronization progress
      tags: &a4
        - health-data
  /v1/health-data/reliability:
    get:
      operationId: HealthDataController_getReliability
      parameters: []
      responses:
        "200":
          description: Returns computed freshness, completeness, confidence, and action
            items.
      security: *a3
      summary: Get overall and per-category sync reliability and guidance
      tags: *a4
  /v1/health-data/sync:
    post:
      operationId: HealthDataController_triggerSync
      parameters: []
      responses:
        "202":
          description: Sync request accepted and started in the background.
      security: *a3
      summary: Manually trigger background health data sync
      tags: *a4
  /v1/health-data/timeline:
    get:
      operationId: HealthDataController_getTimeline
      parameters:
        - name: from
          required: true
          in: query
          schema:
            type: string
        - name: to
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Combined and sorted workouts, sleep, and daily summaries.
      security: *a3
      summary: Get chronological timeline of fitness activities
      tags: *a4
  /v1/health-data/dashboard:
    get:
      operationId: HealthDataController_getDashboard
      parameters: []
      responses:
        "200":
          description: Aggregated steps, calories, last sleep, latest heart rate, and SpO2.
      security: *a3
      summary: Get consolidated summary cards for key health metrics
      tags: *a4
  /v1/health-data/trends:
    get:
      operationId: HealthDataController_getTrends
      parameters:
        - name: days
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Returns historical trends for activity, sleep, resting heart rate,
            and SpO2 with data-source transparency.
      security: *a3
      summary: Get historical trend graphs (7/14/30 days) with reliability reports
      tags: *a4
  /v1/health-data/advanced-records/eligibility:
    get:
      operationId: HealthDataController_getAdvancedEligibility
      parameters: []
      responses:
        "200":
          description: List of record categories with status, reasons, and troubleshooting
            tips.
      security: *a3
      summary: Get advanced records eligibility checklist and catalog
      tags: *a4
  /v1/health-data/advanced-records:
    get:
      operationId: HealthDataController_getAdvancedRecords
      parameters:
        - name: type
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Filtered list of advanced records sorted by timestamp.
      security: *a3
      summary: Get synchronized advanced health records
      tags: *a4
  /v1/coaching/generate:
    post:
      operationId: CoachingController_generateCoaching
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateCoachingDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachingFeedbackResponseDto"
      security: &a5
        - bearer: []
      summary: Generates daily AI coaching feedback grounded in synced metrics
      tags: &a6
        - coaching
  /v1/coaching/latest:
    get:
      operationId: CoachingController_getLatestCoaching
      parameters: []
      responses:
        "200":
          description: Returns latest coaching session or null if none exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachingFeedbackResponseDto"
      security: *a5
      summary: Fetches the latest cached coaching feedback for the user
      tags: *a6
info:
  title: NestJS Backend API
  description: REST API template with authentication, health checks, caching, and analytics
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    cookie:
      type: apiKey
      in: cookie
      name: jwt
      description: JWT token stored in httpOnly cookie
  schemas:
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: user@example.com
          description: User email address
        password:
          type: string
          example: password123
          description: User password
          minLength: 6
      required:
        - email
        - password
    RegisterDto:
      type: object
      properties:
        email:
          type: string
          example: user@example.com
          description: User email address
        password:
          type: string
          example: password123
          description: User password
          minLength: 6
      required:
        - email
        - password
    SessionResponseDto:
      type: object
      properties:
        id:
          type: string
          example: "660000000000000000000001"
          description: Unique session identifier
        createdAt:
          format: date-time
          type: string
          example: 2024-03-30T10:00:00Z
          description: When the session was created
        expiresAt:
          format: date-time
          type: string
          example: 2024-04-30T10:00:00Z
          description: When the session expires
        isCurrent:
          type: boolean
          example: true
          description: Whether this is the current active session
        userAgent:
          type: string
          example: Mozilla/5.0 (Windows NT 10.0; Win64; x64) ...
          description: Which browser user is using
        ipAddress:
          type: string
          example: "[IP_ADDRESS]"
          description: Where the water comes from!
      required:
        - id
        - createdAt
        - expiresAt
        - isCurrent
    HuaweiAuthorizeDto:
      type: object
      properties: {}
    HuaweiUpdateConsentDto:
      type: object
      properties: {}
    HuaweiDisconnectDto:
      type: object
      properties: {}
    GenerateCoachingDto:
      type: object
      properties:
        date:
          type: string
          example: 2026-05-22
          description: Target date for the coaching session YYYY-MM-DD
      required:
        - date
    CoachingFeedbackResponseDto:
      type: object
      properties:
        summary:
          type: string
          description: Short summary of workouts and sleep
        positiveSignals:
          description: Things going well based on metrics
          type: array
          items:
            type: string
        concerns:
          description: Key concerns or recovery warnings
          type: array
          items:
            type: string
        nextActions:
          description: Actionable coaching steps
          type: array
          items:
            type: string
        followUpQuestions:
          description: Clarifying questions about missing segments
          type: array
          items:
            type: string
        confidenceLevel:
          type: string
          enum:
            - high
            - medium
            - low
        hasSafetyAlert:
          type: boolean
          description: Indicator if a safety alert was active
        disclaimer:
          type: string
          description: Compulsory wellness disclaimer
        date:
          type: string
          description: Date the feedback corresponds to
      required:
        - summary
        - positiveSignals
        - concerns
        - nextActions
        - followUpQuestions
        - confidenceLevel
        - hasSafetyAlert
        - disclaimer
        - date
